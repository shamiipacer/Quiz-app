services:
  api: &application
    image: quiz-php
    build:
      context: .
      dockerfile: backend.Dockerfile
    extra_hosts:
      - "proxy:${QUIZ_PROXY_IP:-127.0.0.1}"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app/backend
    volumes:
      - .:/app
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: db,localhost,127.0.0.1
      COMPOSER_HOME: /tmp/composer
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: quiz
      DB_USERNAME: quiz
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env}
    depends_on:
      db:
        condition: service_healthy
  scheduler:
    <<: *application
    ports: []
    command: ["php", "artisan", "schedule:work"]
  worker:
    <<: *application
    ports: []
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=30"]
  migrate:
    image: quiz-php
    extra_hosts:
      - "proxy:${QUIZ_PROXY_IP:-127.0.0.1}"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app/backend
    volumes:
      - .:/app
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: db,localhost,127.0.0.1
      COMPOSER_HOME: /tmp/composer
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: quiz
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "php artisan migrate && php artisan quiz:seed-initial"]
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: quiz
      MYSQL_USER: quiz
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in the root .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql-data:
